# Tooling config for the code-quality gate: ruff (lint + format) and mypy (types).
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# pyflakes (F) catches unused imports and names; pycodestyle (E/W) catches style errors.
# E501 (line too long) is left to the formatter for code; comments may run slightly longer.
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
# Flask, Celery, altcha, structlog and friends don't ship type stubs; don't fail on that.
ignore_missing_imports = true
# The pydantic plugin teaches mypy that a Settings() reads its fields from the environment,
# so an empty constructor call is valid rather than "missing required argument".
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
# The modules (replay.py, app.py, ...) live in the repo root, so put it on the import path.
# Without this, `pytest` run as the console script can't import them (only `python -m pytest`
# adds the current directory), which is exactly what broke the CI test job.
pythonpath = ["."]
testpaths = ["tests"]
