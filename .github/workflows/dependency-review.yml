name: Dependency review

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  # Warning-only dependency review (pull requests only — it diffs the PR's dependencies).
  # Requires the repo's Dependency Graph feature to be enabled.
  dependency-review:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
