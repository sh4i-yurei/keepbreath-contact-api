# Watches the Actions that CI uses. Python packages are managed separately so this grouped weekly
# update stays limited to CI actions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Use the shared labels so Dependabot never creates its own (Global development workflow decision 30).
    labels: ["dependencies", "type:chore"]
    groups:
      actions:
        patterns: ["*"]
